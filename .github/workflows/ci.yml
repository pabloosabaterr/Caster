name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}, DEVELOPER=${{ matrix.developer }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        developer: [0, 1]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator libsdl2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install verilator sdl2

      - name: Show tool versions
        run: |
          verilator --version
          sdl2-config --version

      - name: Build
        run: make DEVELOPER=${{ matrix.developer }}
